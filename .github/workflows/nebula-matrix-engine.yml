name: "NEBULA // CONSTELLATION MATRIX"

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Mission depth"
        type: choice
        required: true
        default: QUICK
        options: [QUICK, DEEP]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: nebula-constellation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boot:
    name: "✦ 00 · STAR GATE / INITIALIZATION"
    runs-on: ubuntu-latest
    outputs:
      profiles: ${{ github.event_name == 'workflow_dispatch' && inputs.profile == 'DEEP' && '["QUICK","DEEP"]' || '["QUICK"]' }}
    steps:
      - name: "Open mission channel"
        run: |
          {
            echo "# ✦ NEBULA CONSTELLATION"
            echo ""
            echo "| Mission signal | Value |"
            echo "|---|---|"
            echo "| Trigger | $GITHUB_EVENT_NAME |"
            echo "| Ref | $GITHUB_REF |"
            echo "| Commit | $GITHUB_SHA |"
            echo "| Runner | $RUNNER_OS / $RUNNER_ARCH |"
            echo ""
            echo "Star gate initialized. Subsystems are cleared for launch."
          } >> "$GITHUB_STEP_SUMMARY"

  matrix:
    name: "${{ matrix.domain }} / ${{ matrix.profile }}"
    needs: boot
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        domain: [REPOSITORY, SECURITY, DEPENDENCIES, BUILD, PERFORMANCE, RELEASE, DOCUMENTATION, AUTOMATION]
        profile: ${{ fromJSON(needs.boot.outputs.profiles) }}
    steps:
      - name: "Initialize subsystem"
        run: |
          echo "## ${{ matrix.domain }} · ${{ matrix.profile }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Subsystem online · run $GITHUB_RUN_NUMBER · attempt $GITHUB_RUN_ATTEMPT"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Execute subsystem scan"
        env:
          DOMAIN: ${{ matrix.domain }}
          PROFILE: ${{ matrix.profile }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "nebula-report/$DOMAIN"
          REPORT="nebula-report/$DOMAIN/result.txt"
          case "$DOMAIN" in
            REPOSITORY)
              {
                echo "Tracked files: $(git ls-files | wc -l)"
                echo "Directories: $(find . -type d -not -path './.git*' | wc -l)"
                git log -1 --format='Latest commit: %h %s' || true
              } | tee "$REPORT"
              ;;
            SECURITY)
              if git grep -n -I -E 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' -- . ':!*.lock' > "nebula-report/$DOMAIN/findings.txt"; then
                echo "Potential private-key marker found. Inspect findings artifact." | tee "$REPORT"
                cat "nebula-report/$DOMAIN/findings.txt"
                exit 1
              else
                echo "No private-key markers detected in tracked text." | tee "$REPORT"
              fi
              ;;
            DEPENDENCIES)
              find . -maxdepth 6 -type f \( -name 'package.json' -o -name '*lock*' -o -name 'pubspec.yaml' -o -name 'pom.xml' -o -name 'build.gradle' -o -name 'build.gradle.kts' -o -name 'requirements.txt' -o -name 'pyproject.toml' -o -name 'Cargo.toml' -o -name 'go.mod' \) -not -path './.git/*' | sort | tee "$REPORT"
              ;;
            BUILD)
              for f in package.json pubspec.yaml pom.xml build.gradle build.gradle.kts settings.gradle settings.gradle.kts Cargo.toml go.mod Makefile CMakeLists.txt; do
                [ ! -f "$f" ] || echo "Detected build manifest: $f"
              done | tee "$REPORT"
              [ -s "$REPORT" ] || echo "No supported root build manifest detected." > "$REPORT"
              ;;
            PERFORMANCE)
              {
                echo "Repository footprint: $(du -sh . --exclude=.git | cut -f1)"
                echo "Tracked files: $(git ls-files | wc -l)"
                echo "Commit count: $(git rev-list --count HEAD)"
              } | tee "$REPORT"
              ;;
            RELEASE)
              {
                echo "Current ref: $GITHUB_REF"
                echo "Latest tag: $(git describe --tags --abbrev=0 2>/dev/null || echo 'No tags found')"
              } | tee "$REPORT"
              ;;
            DOCUMENTATION)
              for f in README.md CONTRIBUTING.md CODE_OF_CONDUCT.md SECURITY.md LICENSE; do
                [ -f "$f" ] && echo "PRESENT $f" || echo "MISSING $f"
              done | tee "$REPORT"
              ;;
            AUTOMATION)
              find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) 2>/dev/null | sort | tee "$REPORT" || true
              ;;
          esac
          if [ "$PROFILE" = "DEEP" ]; then
            {
              echo ""
              echo "Branch: $GITHUB_REF_NAME"
              echo "SHA: $GITHUB_SHA"
              echo "Runner: $RUNNER_OS/$RUNNER_ARCH"
            } >> "$REPORT"
          fi
          cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: "nebula-${{ matrix.domain }}-${{ matrix.profile }}"
          path: nebula-report/
          if-no-files-found: error
          retention-days: 14

  signal-analysis:
    name: "✧ 02 · SIGNAL ANALYSIS"
    if: always()
    needs: [boot, matrix]
    runs-on: ubuntu-latest
    steps:
      - name: "Evaluate subsystem constellation"
        env:
          MATRIX_RESULT: ${{ needs.matrix.result }}
          PROFILE_SET: ${{ needs.boot.outputs.profiles }}
        run: |
          {
            echo "# ✧ SIGNAL ANALYSIS"
            echo ""
            echo "| Signal | Reading |"
            echo "|---|---|"
            echo "| Matrix status | $MATRIX_RESULT |"
            echo "| Active profiles | $PROFILE_SET |"
            echo "| Domains | 8 |"
            echo "| Planned lanes | 8 × selected profiles |"
            echo "| Run | $GITHUB_RUN_NUMBER |"
            echo ""
            echo "Subsystem results are ready for mission control."
          } >> "$GITHUB_STEP_SUMMARY"

  mission-control:
    name: "◈ 03 · MISSION CONTROL / FINAL SYNTHESIS"
    if: always()
    needs: [boot, matrix, signal-analysis]
    runs-on: ubuntu-latest
    steps:
      - name: "Close constellation"
        env:
          BOOT_RESULT: ${{ needs.boot.result }}
          MATRIX_RESULT: ${{ needs.matrix.result }}
          ANALYSIS_RESULT: ${{ needs.signal-analysis.result }}
        run: |
          {
            echo "# ◈ NEBULA MISSION CONTROL"
            echo ""
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Star gate | $BOOT_RESULT |"
            echo "| Constellation matrix | $MATRIX_RESULT |"
            echo "| Signal analysis | $ANALYSIS_RESULT |"
            echo ""
            echo "Mission synthesis complete. Inspect individual subsystem jobs and artifacts for evidence."
          } >> "$GITHUB_STEP_SUMMARY"
