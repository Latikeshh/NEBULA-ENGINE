<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
<title id="title">NEBULA-ENGINE — Autonomous workflow universe</title>
<desc id="desc">A futuristic deep-space command center with a glowing orbital nebula, neon cyan and violet interface elements, and a matrix of automation signals.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030713"/><stop offset=".52" stop-color="#0a1230"/><stop offset="1" stop-color="#170b2b"/></linearGradient>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22eaff"/><stop offset=".5" stop-color="#8c65ff"/><stop offset="1" stop-color="#ff4de1"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102a48" stop-opacity=".92"/><stop offset="1" stop-color="#160f32" stop-opacity=".95"/></linearGradient>
  <radialGradient id="planet"><stop stop-color="#a6fbff"/><stop offset=".25" stop-color="#2687d7"/><stop offset=".72" stop-color="#28216b"/><stop offset="1" stop-color="#070b20"/></radialGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#58baff" stroke-opacity=".12" stroke-width="1"/></pattern>
</defs>
<rect width="1600" height="620" rx="28" fill="url(#bg)"/>
<rect width="1600" height="620" rx="28" fill="url(#grid)"/>
<g fill="#d8f7ff" opacity=".8">
<circle cx="95" cy="83" r="2"/><circle cx="225" cy="170" r="1.5"/><circle cx="385" cy="75" r="2"/><circle cx="570" cy="135" r="1.5"/><circle cx="760" cy="52" r="2"/><circle cx="990" cy="105" r="1.5"/><circle cx="1190" cy="55" r="2"/><circle cx="1470" cy="150" r="2"/><circle cx="1390" cy="365" r="1.5"/><circle cx="180" cy="470" r="2"/><circle cx="540" cy="540" r="1.5"/>
</g>
<g opacity=".9" filter="url(#glow)">
<ellipse cx="320" cy="275" rx="260" ry="75" fill="none" stroke="#14dfff" stroke-width="5" transform="rotate(-18 320 275)"/>
<ellipse cx="320" cy="275" rx="225" ry="55" fill="none" stroke="#a64dff" stroke-width="3" transform="rotate(14 320 275)"/>
<circle cx="320" cy="275" r="95" fill="url(#planet)"/>
<path d="M224 276Q320 220 416 276" fill="none" stroke="#9dfaff" stroke-opacity=".6" stroke-width="2"/>
</g>
<g opacity=".85" transform="translate(1180 95)">
<circle cx="145" cy="140" r="118" fill="url(#planet)" stroke="#42dfff" stroke-opacity=".6" stroke-width="2"/>
<ellipse cx="145" cy="140" rx="172" ry="40" fill="none" stroke="#9b5cff" stroke-width="3" transform="rotate(-22 145 140)" filter="url(#glow)"/>
</g>
<path d="M0 390Q250 330 470 395T900 385T1600 365V620H0Z" fill="#080e25" opacity=".86"/>
<path d="M0 390Q250 330 470 395T900 385T1600 365" fill="none" stroke="url(#neon)" stroke-width="3" opacity=".7" filter="url(#glow)"/>
<g transform="translate(520 110)">
  <rect width="650" height="300" rx="24" fill="#050b1d" fill-opacity=".76" stroke="url(#neon)" stroke-width="2"/>
  <text x="325" y="45" fill="#8ef5ff" font-family="monospace" font-size="15" letter-spacing="6" text-anchor="middle">AUTONOMOUS OPERATIONS NETWORK</text>
  <text x="325" y="135" fill="#f5f8ff" font-family="Arial,sans-serif" font-size="62" font-weight="800" text-anchor="middle">NEBULA<tspan fill="#28e5ff">-</tspan><tspan fill="#bd75ff">ENGINE</tspan></text>
  <text x="325" y="180" fill="#d7d8ff" font-family="Arial,sans-serif" font-size="24" text-anchor="middle">AUTONOMOUS WORKFLOWS. INTELLIGENT OPERATIONS.</text>
  <path d="M90 212H560" stroke="url(#neon)" stroke-width="2" opacity=".8"/>
  <g font-family="monospace" font-size="15" fill="#a9f6ff" text-anchor="middle">
    <text x="115" y="252">MATRIX</text><text x="325" y="252">DIAGNOSTICS</text><text x="535" y="252">REPORTS</text>
  </g>
  <g fill="#2deaff" filter="url(#glow)"><circle cx="115" cy="275" r="5"/><circle cx="325" cy="275" r="5"/><circle cx="535" cy="275" r="5"/></g>
  <path d="M120 275H320M330 275H530" stroke="#8e65ff" stroke-width="2"/>
</g>
<g transform="translate(70 505)" font-family="monospace" font-size="17" fill="#9cefff">
  <text x="0" y="0">[ SYSTEM ONLINE ]</text><text x="260" y="0" fill="#c18aff">[ 16-LANE MATRIX ]</text><text x="555" y="0" fill="#9cefff">[ MISSION CONTROL ]</text>
</g>
<rect x="18" y="18" width="1564" height="584" rx="22" fill="none" stroke="url(#neon)" stroke-opacity=".65" stroke-width="2"/>
</svg>